name: vehicletracking

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - application

  backend:
    build:
      context: ./vehicletracking-backend
      dockerfile: Dockerfile
    image: vehicletracking-backend:local
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_ENV_IMPORT: optional:classpath:/no-local-env.properties
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      DB_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms128m -Xmx768m}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - application

  frontend:
    build:
      context: ./vehicletracking-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /
    image: vehicletracking-frontend:local
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    networks:
      - application

networks:
  application:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
