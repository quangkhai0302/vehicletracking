name: CI/CD production

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vehicletracking-production
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vehicletracking-frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: vehicletracking-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: ./node_modules/.bin/tsc --noEmit

      - name: Build production frontend
        env:
          VITE_API_BASE_URL: /
        run: npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: vehicletracking-backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
          cache-dependency-path: vehicletracking-backend/pom.xml

      - name: Run backend tests
        run: ./mvnw --batch-mode --no-transfer-progress test

  deploy:
    name: Deploy to EC2 through SSM
    needs:
      - frontend
      - backend
    if: >-
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate deployment variables
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          AWS_INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in AWS_ACCOUNT_ID AWS_DEPLOY_ROLE_ARN AWS_INSTANCE_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required repository variable: $name" >&2
              exit 1
            fi
          done

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ap-southeast-1
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: vehicletracking-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Deploy exact tested commit
        env:
          AWS_REGION: ap-southeast-1
          INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
        shell: bash
        run: |
          set -Eeuo pipefail

          remote_command="sudo -u ubuntu -H bash -lc 'cd /home/ubuntu/vehicletracking && git fetch --prune origin master && git reset --hard ${GITHUB_SHA} && bash deploy/aws/deploy.sh'"
          jq -n --arg command "$remote_command" '{commands: [$command]}' > ssm-parameters.json

          command_id="$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy vehicletracking ${GITHUB_SHA}" \
            --timeout-seconds 1800 \
            --parameters file://ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)"

          echo "SSM command: $command_id"
          status="Pending"
          for _ in $(seq 1 360); do
            status="$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo Pending)"
            case "$status" in
              Success|Failed|TimedOut|Cancelled|Cancelling) break ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text || true

          if [[ "$status" != "Success" ]]; then
            aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query 'StandardErrorContent' \
              --output text || true
            echo "Deployment failed with SSM status: $status" >&2
            exit 1
          fi

          echo "Deployment completed for ${GITHUB_SHA}"
