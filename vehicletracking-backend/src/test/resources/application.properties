# Keep the main application.yaml visible to RouteEnvironmentImportTest; test-only
# overrides belong in a separate properties file so config-data import assertions
# continue to exercise the production import list.
auth.security-enabled=false
spring.mvc.problemdetails.enabled=true
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
# Integration-test application contexts are cached longer than their Testcontainers.
# Background simulation ticks would otherwise keep polling databases that are already stopped.
app.simulation.scheduling-enabled=false
# Polling is a production concern and can race with mocked clocks or stopped test databases.
trip-scheduling.enabled=false
